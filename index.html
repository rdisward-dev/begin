<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>人偶苏醒协议 - 意识上传终端 V4.7</title>
    <style>
        :root {
            --neon-green: #39ff14;
            --blood-red: #bb0000;
            --terminal-bg: #0a0a0a;
            --border-color: #444;
            --text-dim: #888;
            --highlight: #55ff55;
        }

        body {
            background-color: var(--terminal-bg);
            color: var(--neon-green);
            font-family: 'Courier New', 'SimSun', monospace;
            padding: 20px;
            line-height: 1.4;
            font-size: 14px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            border: 2px solid var(--border-color);
            padding: 20px;
            box-shadow: 0 0 20px rgba(187, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            border-bottom: 2px solid var(--blood-red);
            padding-bottom: 10px;
            color: var(--blood-red);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-top: 0;
            text-shadow: 0 0 10px var(--blood-red);
        }

        .section {
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            padding: 15px;
            position: relative;
            background: rgba(255, 255, 255, 0.02);
        }

        .section-title {
            background: var(--border-color);
            color: #fff;
            padding: 2px 10px;
            position: absolute;
            top: -12px;
            left: 15px;
            font-size: 0.85em;
            text-transform: uppercase;
        }

        .field-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .field {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 200px;
        }

        label {
            font-size: 0.8em;
            margin-bottom: 4px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .desc-box {
            font-size: 0.75em;
            color: #777;
            margin-top: 4px;
            padding: 4px;
            border-left: 2px solid #333;
            min-height: 3em;
            background: rgba(0,0,0,0.3);
        }

        .skill-desc {
            color: var(--highlight);
            border-left-color: var(--blood-red);
        }

        input, select {
            background: #000;
            border: 1px solid #444;
            color: var(--neon-green);
            padding: 8px;
            outline: none;
            font-family: inherit;
        }

        input:focus, select:focus {
            border-color: var(--blood-red);
        }

        .roll-btn {
            background: #222;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-size: 0.7em;
            cursor: pointer;
            padding: 2px 6px;
            transition: 0.2s;
        }

        .roll-btn:hover {
            background: var(--neon-green);
            color: #000;
        }

        .btn-container {
            text-align: center;
            margin-top: 20px;
        }

        button.main-btn {
            background: var(--blood-red);
            color: white;
            border: none;
            padding: 15px 50px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1.1em;
            box-shadow: 0 0 10px rgba(187, 0, 0, 0.5);
        }

        button.main-btn:hover {
            background: #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
        }

        #output-area {
            margin-top: 20px;
            display: none;
        }

        #output-text {
            width: 100%;
            height: 200px;
            background: #050505;
            color: #ffaa00;
            font-size: 11px;
            border: 1px solid var(--blood-red);
            padding: 10px;
            white-space: pre;
            font-family: monospace;
        }

        .hint {
            color: var(--blood-red);
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;

</head>

<div class="container">
    <h1>人偶苏醒协议 (Project Nechronica)</h1>

            </div>
            <div class="field" style="flex: 0.5; min-width: 80px;">
                <label>精神年龄</label>
                <input type="number" id="age_mind" value="10">

            </div>
        </div>
        <div class="field-group" style="margin-top:15px;">
            <div class="field">
                <label>职位</label>
                <select id="position" onchange="updateUI()"></select>
                <div id="desc_pos" class="desc-box"></div>
            </div>
            <div class="field">
                <label>主要职阶</label>
                <select id="main_class" onchange="updateUI()"></select>
                <div id="desc_main" class="desc-box"></div>
            </div>
            <div class="field">
                <label>辅助职阶</label>
                <select id="sub_class" onchange="updateUI()"></select>
                <div id="desc_sub" class="desc-box"></div>
            </div>
        </div>
    </div>

    <div class="section">
        <span class="section-title">🧠 技能植入</span>
        <div class="field-group">
            <div class="field">
                <label>职位专属技能</label>
                <select id="skill_pos" onchange="updateSkillDesc()"></select>
                <div id="sd_pos" class="desc-box skill-desc"></div>
            </div>
            <div class="field">
                <label>职阶技能 I</label>
                <select id="skill_main_1" onchange="updateSkillDesc()"></select>
                <div id="sd_m1" class="desc-box skill-desc"></div>
            </div>
            <div class="field">
                <label>职阶技能 II</label>
                <select id="skill_main_2" onchange="updateSkillDesc()"></select>
                <div id="sd_m2" class="desc-box skill-desc"></div>
            </div>
        </div>
        <div class="field-group" style="margin-top:10px;">
            <div class="field">
                <label>辅助职阶技能</label>
                <select id="skill_sub" onchange="updateSkillDesc()"></select>
                <div id="sd_sub" class="desc-box skill-desc"></div>
            </div>
            <div class="field" id="spec_field" style="display:none;">
                <label style="color:var(--blood-red)">特化解锁</label>
                <select id="skill_spec" onchange="updateSkillDesc()"></select>
                <div id="sd_spec" class="desc-box skill-desc"></div>
            </div>
        </div>
    </div>

    <div class="section">
        <span class="section-title">⛓️ 记忆与锚点</span>
        <div class="field-group">
            <div class="field">
                <label>记忆碎片 A <button class="roll-btn" onclick="rollMem('mem_1')">ROLL</button></label>
                <select id="mem_1" onchange="updateMemDesc('mem_1', 'md_1')"></select>
                <div id="md_1" class="desc-box"></div>
            </div>
            <div class="field">
                <label>记忆碎片 B <button class="roll-btn" onclick="rollMem('mem_2')">ROLL</button></label>
                <select id="mem_2" onchange="updateMemDesc('mem_2', 'md_2')"></select>
                <div id="md_2" class="desc-box"></div>
            </div>
            <div class="field">
                <label>宝物部件 <button class="roll-btn" onclick="rollTrea()">ROLL</button></label>
                <select id="treasure" onchange="updateTreaDesc()"></select>
                <div id="td_1" class="desc-box"></div>
            </div>
        </div>
    </div>

    <div class="btn-container">
        <button class="main-btn" onclick="sendAwakening()">生成苏醒指令</button>
    </div>

    <div id="output-area">
        <div class="hint">指令已生成！请全部复制并直接发给青子：</div>
        <textarea id="output-text" readonly onclick="this.select(); document.execCommand('copy'); alert('已自动复制到剪贴板。');"></textarea>
    </div>
</div>

function populate(id, list) {
    const e = document.getElementById(id);
    e.innerHTML = "";
    list.forEach(i => {
        const o = document.createElement("option");
        o.value = o.text = i;
        e.add(o);
    });
}

function updateUI() {
    const p = document.getElementById('position').value;
    const m = document.getElementById('main_class').value;
    const s = document.getElementById('sub_class').value;

    document.getElementById('desc_pos').innerText = library.pos[p].d;
    document.getElementById('desc_main').innerText = library.cls[m].d;
    document.getElementById('desc_sub').innerText = library.cls[s].d;

    populate('skill_pos', Object.keys(library.pos[p].s));
    populate('skill_main_1', Object.keys(library.cls[m].s));
    populate('skill_main_2', Object.keys(library.cls[m].s));
    document.getElementById('skill_main_2').selectedIndex = 1;
    populate('skill_sub', Object.keys(library.cls[s].s));

    const sf = document.getElementById('spec_field');
    if (m === s) {
        sf.style.display = "block";
        populate('skill_spec', [Object.keys(library.cls[m].t)[0]]);
    } else sf.style.display = "none";

    updateSkillDesc();
}

function updateSkillDesc() {
    const p = document.getElementById('position').value;
    const m = document.getElementById('main_class').value;
    const s = document.getElementById('sub_class').value;

    document.getElementById('sd_pos').innerText = library.pos[p].s[document.getElementById('skill_pos').value] || "";
    document.getElementById('sd_m1').innerText = library.cls[m].s[document.getElementById('skill_main_1').value] || "";
    document.getElementById('sd_m2').innerText = library.cls[m].s[document.getElementById('skill_main_2').value] || "";
    document.getElementById('sd_sub').innerText = library.cls[s].s[document.getElementById('skill_sub').value] || "";
    if (m === s) document.getElementById('sd_spec').innerText = library.cls[m].t[document.getElementById('skill_spec').value] || "";
}

function updateMemDesc(selId, descId) {
    document.getElementById(descId).innerText = library.mem[document.getElementById(selId).value];
}

function updateTreaDesc() {
    document.getElementById('td_1').innerText = library.trea[document.getElementById('treasure').value];
}

function rollMem(id) {
    const keys = Object.keys(library.mem);
    document.getElementById(id).value = keys[Math.floor(Math.random() * keys.length)];
    updateMemDesc(id, id === 'mem_1' ? 'md_1' : 'md_2');
}

function rollTrea() {
    const keys = Object.keys(library.trea);
    document.getElementById('treasure').value = keys[Math.floor(Math.random() * keys.length)];
    updateTreaDesc();
}

// =================== 核心功能：生成苏醒消息 + 写入变量 + 触发AI ===================
async function sendAwakening() {
    // 1. 收集所有表单数据
    const name = document.getElementById('name').value.trim() || "未命名人偶";
    const ageBody = parseInt(document.getElementById('age_body').value);
    const ageMind = parseInt(document.getElementById('age_mind').value);
    const position = document.getElementById('position').value;
    const mainClass = document.getElementById('main_class').value;
    const subClass = document.getElementById('sub_class').value;
    const skillPos = document.getElementById('skill_pos').value;
    const skillMain1 = document.getElementById('skill_main_1').value;
    const skillMain2 = document.getElementById('skill_main_2').value;
    const skillSub = document.getElementById('skill_sub').value;
    const skillSpec = (mainClass === subClass) ? document.getElementById('skill_spec').value : "无";
    const mem1 = document.getElementById('mem_1').value;
    const mem2 = document.getElementById('mem_2').value;
    const treasure = document.getElementById('treasure').value;

    // 2. 构造开场白文本 (叙事风格，供 AI 阅读)
    const awakeningMessage = `【人偶苏醒协议 · 意识上传记录】

========== 素体档案 ==========
识别名：${name}
肉体享年：${ageBody}岁
精神年龄：${ageMind}岁
职位：${position}
主要职阶：${mainClass}
辅助职阶：${subClass}

========== 技能植入 ==========
职位专属技能：${skillPos}
职阶技能 I：${skillMain1}
职阶技能 II：${skillMain2}
辅助职阶技能：${skillSub}
${mainClass === subClass ? `特化技能：${skillSpec}` : ""}

========== 记忆与锚点 ==========
记忆碎片 A：${mem1} —— ${library.mem[mem1]}
记忆碎片 B：${mem2} —— ${library.mem[mem2]}
宝物部件：${treasure} —— ${library.trea[treasure]}

苏醒协议已完成。请青子（AI）根据以上设定生成首轮叙事回应。`;

    // 3. 尝试自动写入变量 + 发送消息 + 触发AI
    const context = getSillyTavernContext();
    if (context) {
        // 3.1 将关键信息写入本地变量 (供后续对话使用)
        await setVariablesViaContext(context, {
            "character_name": name,
            "age_body": ageBody,
            "age_mind": ageMind,
            "position": position,
            "main_class": mainClass,
            "sub_class": subClass,
            "skill_pos": skillPos,
            "skill_main1": skillMain1,
            "skill_main2": skillMain2,
            "skill_sub": skillSub,
            "skill_spec": skillSpec,
            "memory_A": mem1,
            "memory_B": mem2,
            "treasure": treasure,
            "awakening_sent": "true"
        });

        // 3.2 发送用户消息（觉醒协议）
        await sendUserMessage(context, awakeningMessage);

        // 3.3 触发 AI 回复 (类似 /trigger)
        await triggerAIReply(context);

        alert("苏醒指令已发送！AI 正在生成首轮回应……");
        document.getElementById('output-area').style.display = 'none'; // 隐藏手动复制区
    } else {
        // 无法自动交互时降级为手动复制
        const fallbackCommand = `【请手动复制以下内容并发送到聊天框】\n\n${awakeningMessage}\n\n（请 AI 根据以上设定生成首轮叙事）`;
        document.getElementById('output-text').value = fallbackCommand;
        document.getElementById('output-area').style.display = 'block';
        alert("未能连接到酒馆，请手动复制下方内容并发送。");
    }
}

// 获取酒馆的 Context (兼容 iframe / opener)
function getSillyTavernContext() {
    try {
        if (window.SillyTavern?.getContext) return window.SillyTavern.getContext();
        if (parent?.SillyTavern?.getContext) return parent.SillyTavern.getContext();
        if (window.opener?.SillyTavern?.getContext) return window.opener.SillyTavern.getContext();
    } catch(e) { console.warn(e); }
    return null;
}

// 通过 Context 的变量 API 批量设置本地变量
async function setVariablesViaContext(context, varsMap) {
    if (!context || !context.variables) {
        console.warn("未找到变量API，尝试通过系统消息发送 /setvar 命令");
        // 降级方案：通过系统消息发送斜杠命令
        const cmds = Object.entries(varsMap).map(([k, v]) => `/setvar ${k} ${String(v).replace(/\s/g, '_')}`);
        for (const cmd of cmds) {
            if (context.sendSystemMessage) await context.sendSystemMessage(cmd);
        }
        return;
    }
    // 优先使用官方变量接口 (SillyTavern 0.12+)
    for (const [key, value] of Object.entries(varsMap)) {
        try {
            await context.variables.setLocalVariable(key, String(value));
        } catch(e) { console.warn(`设置变量 ${key} 失败:`, e); }
    }
}

// 发送用户消息 (会显示在聊天记录中)
async function sendUserMessage(context, message) {
    // 优先使用 chat.sendMessage
    if (context.chat && typeof context.chat.sendMessage === 'function') {
        await context.chat.sendMessage(message);
        return;
    }
    // 备选：使用 createChatMessages (类似目标前端)
    if (typeof createChatMessages === 'function') {
        await createChatMessages([{ role: "user", message: message }]);
        return;
    }
    // 最后尝试模拟输入框事件
    const inputArea = document.querySelector('#send_textarea, .ta-scroll-window>textarea, textarea');
    if (inputArea) {
        inputArea.value = message;
        inputArea.dispatchEvent(new Event('input', { bubbles: true }));
        const sendBtn = document.querySelector('#send_button, .send_btn, button[type=submit]');
        if (sendBtn) sendBtn.click();
    } else {
        throw new Error("无法找到聊天输入框或发送方法");
    }
}

// 触发 AI 生成回复 (等同于 /trigger 命令)
async function triggerAIReply(context) {
    // 方法一：使用 triggerSlash 全局函数 (目标前端方式)
    if (typeof triggerSlash === 'function') {
        await triggerSlash("/trigger await=true");
        return;
    }
    // 方法二：通过系统命令发送 /trigger
    if (context.sendSystemMessage) {
        await context.sendSystemMessage("/trigger await=true");
        return;
    }
    // 方法三：直接调用生成函数 (如果存在)
    if (context.chat && typeof context.chat.generate === 'function') {
        await context.chat.generate();
        return;
    }
    // 方法四：模拟点击发送后的自动生成（通常发送消息后会自动触发，这里不做额外操作）
    console.log("未找到显式触发方法，依赖发送消息后的自动生成。");
}

window.onload = function() {
    populate('position', Object.keys(library.pos));
    populate('main_class', Object.keys(library.cls));
    populate('sub_class', Object.keys(library.cls));
    populate('mem_1', Object.keys(library.mem));
    populate('mem_2', Object.keys(library.mem));
    populate('treasure', Object.keys(library.trea));
    updateUI();
};
